name: CrickPlaylist Auto Update

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: jtv2-automation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run JTV Plus 2 updater
        shell: bash
        run: |
          set -euo pipefail
          python scripts/jtvplus2.py

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git add jtv2.json jtvplus2.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update playlist ($(date -u '+%Y-%m-%d %H:%M UTC'))"

      - name: Rebase and push
        shell: bash
        run: |
          set -euo pipefail

          # The updater is only allowed to generate these two files.
          # Make sure no unexpected working-tree changes can block rebase.
          git reset --hard HEAD

          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push succeeded."
                exit 0
              fi
            else
              git rebase --abort || true
            fi

            # Restore the committed state before the next attempt.
            git reset --hard HEAD
            echo "Push/rebase failed on attempt $attempt; retrying..."
            sleep $((attempt * 3))
          done

          echo "Unable to push after 5 attempts."
          exit 1
