name: CrickPlaylist Auto Update

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: jtv2-automation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run JTV Plus 2 updater
        shell: bash
        run: |
          set -euo pipefail
          python scripts/jtvplus2.py

      - name: Commit and push generated files
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Update attempt $attempt..."

            # Always build the generated-file commit on top of the latest
            # remote main. This avoids rebasing large playlist/JSON files.
            git fetch origin main
            git reset --soft origin/main

            git add jtv2.json jtvplus2.m3u

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "Auto-update playlist ($(date -u '+%Y-%m-%d %H:%M UTC'))"

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed because main changed; retrying..."
            git reset --hard origin/main
            sleep $((attempt * 3))
          done

          echo "Unable to push after 5 attempts."
          exit 1
