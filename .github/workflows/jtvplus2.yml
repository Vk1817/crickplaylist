name: Update JTV PLUS 2 Playlist

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/jtvplus2.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: jtv2-automation
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run JTV Plus 2 updater
        run: |
          set -euo pipefail
          python scripts/jtvplus2.py

      - name: Commit and push generated files
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "Update attempt $attempt..."

            # Always build the generated-file commit on top of the latest
            # remote main. This avoids rebasing large playlist/JSON files.
            git fetch origin main
            git reset --soft origin/main

            git add jtvplus2.m3u jtv2.json

            if git diff --cached --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "Auto-update playlist ($(date -u '+%Y-%m-%d %H:%M UTC'))"

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push failed because main changed; retrying..."
            git reset --hard origin/main
            sleep $((attempt * 3))
          done

          echo "Unable to push after 5 attempts."
          exit 1
